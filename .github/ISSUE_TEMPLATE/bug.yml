name: Bug
description: Something that doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is an early, experimental release, tested on Windows with Orca and WoW: Forever. Detailed but straightforward reports help most: what happened, plainly, without an essay.

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Windows (`winver`), Orca (its About screen, on every computer involved), orca-wow (`orca-wow status`), and your controller if it's involved.
      placeholder: e.g. Windows 11 24H2, Orca 1.4.255 (PC) and 1.4.255 (MacBook), orca-wow 0.4.1, Xbox Series controller
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Steps to reproduce if you have them.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `orca-wow status --log`, and the text from `/orca report` in game.
      render: text

  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or video
      description: For anything you can see in game, drag in a screenshot or a short recording.
