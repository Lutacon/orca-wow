# Pushing a tag like v0.4.0 runs the tests, then publishes a GitHub release with
# orca-wow-v0.4.0.zip (the repository without its development files, see
# .gitattributes) and that version's section of CHANGELOG.md as its notes.
#
# The bridge tests run on Windows, the platform this fork tests; the Lua side (the
# addon's crypto agreeing with Node's, and the addon smoke test) runs on Linux, where
# lua5.1 and luajit are a package away.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bridge-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bridge tests
        working-directory: bridge
        run: node --test test/*.test.js

  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 luajit
      - name: Addon crypto agrees with the bridge's
        working-directory: bridge
        run: node --test test/crypto.test.js
      - name: Addon smoke test
        run: luajit tools/smoke.lua addon/OrcaWow tools/fixture_snapshot.lua

  release:
    needs: [bridge-tests, lua-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$v\"" bridge/package.json
          grep -q "^## Version: $v" addon/OrcaWow/OrcaWow.toc
          grep -q "VERSION = '$v'" bridge/src/bridge.js
          tr -d '\r' < CHANGELOG.md | grep -q "^## $v\$"

      - name: Build the zip
        run: |
          name="orca-wow-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="$name/" -o "$name.zip" HEAD
          unzip -l "$name.zip" | tail -n 1

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          tr -d '\r' < CHANGELOG.md | awk -v v="$v" '/^## /{p = ($2 == v); next} p' > notes.md
          test -s notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "orca-wow-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md

      # The addon alone (the OrcaWow folder) goes to CurseForge once the project exists:
      # set the repository variable CF_PROJECT_ID and the secret CF_API_KEY (see
      # docs/CURSEFORGE.md). Without them this step is skipped.
      - name: Upload the addon to CurseForge
        if: ${{ vars.CF_PROJECT_ID != '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          test -n "$CF_API_KEY" || { echo "CF_API_KEY isn't set"; exit 1; }
          zipname="OrcaWow-${GITHUB_REF_NAME}.zip"
          (cd addon && zip -qr "../$zipname" OrcaWow)
          # The TOC's interface number names the game version: 16001 is 1.60.1.
          iface=$(tr -d '\r' < addon/OrcaWow/OrcaWow.toc | sed -n 's/^## Interface: *\([0-9]*\).*/\1/p')
          gv="$((iface / 10000)).$((iface / 100 % 100)).$((iface % 100))"
          ids=$(curl -fsS -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions | jq -c --arg n "$gv" '[.[] | select(.name == $n) | .id]')
          echo "game version $gv: $ids"
          test "$(jq length <<< "$ids")" = 1 || { echo "expected exactly one CurseForge game version called $gv"; exit 1; }
          meta=$(jq -n --rawfile notes notes.md --arg name "$GITHUB_REF_NAME" --argjson ids "$ids" '{changelog: $notes, changelogType: "markdown", displayName: $name, gameVersions: $ids, releaseType: "release"}')
          curl -fsS -H "X-Api-Token: $CF_API_KEY" --form-string "metadata=$meta" -F "file=@$zipname" "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
